<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis pedidos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:Montserrat,sans-serif;
  background:#e5e7eb;
  padding:20px;
}
.order{
  background:white;
  padding:16px;
  border-radius:12px;
  margin-bottom:12px;
}
.order button{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#0ea5e9;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>🧾 Mis pedidos</h1>
<div id="orders"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  where,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB82EorZSZo5exTSGETod4HS8YuIg1WaNk",
  authDomain: "myke-store.firebaseapp.com",
  projectId: "myke-store"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const cont = document.getElementById("orders");

onAuthStateChanged(auth, user => {
  if (!user || user.isAnonymous) {
    alert("Debes iniciar sesión");
    location.href = "index.html";
    return;
  }

  const q = query(
    collection(db, "orders"),
    where("userId", "==", user.uid),
    orderBy("createdAt", "desc")
  );

  onSnapshot(q, snap => {
    cont.innerHTML = "";

    if (snap.empty) {
      cont.innerHTML = "<p>No tienes pedidos aún.</p>";
      return;
    }

    snap.forEach(d => {
      const o = d.data();
      cont.innerHTML += `
        <div class="order">
          <strong>Total: S/ ${o.total}</strong><br>
          <small>Estado: ${o.status}</small><br>
          <button onclick="view('${d.id}')">Ver pedido</button>
        </div>
      `;
    });
  });
});

window.view = id => {
  location.href = "pedido.html?id=" + id;
};
</script>

</body>
</html>
