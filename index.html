<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myke Store</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="imagenes/logo.png">
<link rel="icon" type="image/png" sizes="16x16" href="imagenes/logo.png">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Montserrat',sans-serif}
body{
  background:#e5e7eb; /* gris más marcado */
  color:#0f172a;
}


/* HEADER */
header{
  background:#ffffff;
    padding:16px 24px; /* ⬅️ ANTES 28px */
  color:#0f172a;
  box-shadow:0 4px 12px rgba(0,0,0,.06);
}

.header-top{display:flex;align-items:center;gap:20px}
.logo{height:180px;cursor:pointer}
.search-area{flex:1;display:flex;gap:10px}
.search-area input{
  flex:1;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#374151;   /* gris oscuro */
  color:#ffffff;        /* texto blanco */
}

/* Texto del placeholder */
.search-area input::placeholder{
  color:#d1d5db;
}

/* Cuando haces clic */
.search-area input:focus{
  outline:none;
  background:#1f2937;   /* un poco más oscuro */
}

.cat-btn{padding:12px 16px;border:none;border-radius:14px;font-size:22px;background:#334155;color:white}
.icons{display:flex;gap:14px;align-items:center}

/* CART ICON */
.cart-icon{position:relative;font-size:22px;cursor:pointer;transition:.3s}
.cart-icon.bounce{animation:bounce .4s}
@keyframes bounce{
  0%{transform:scale(1)}
  50%{transform:scale(1.25)}
  100%{transform:scale(1)}
}
.cart-count{
  position:absolute;top:-6px;right:-10px;
  background:#dc2626;color:white;
  font-size:12px;padding:2px 6px;border-radius:50%
}


.login-btn{
  background:#0ea5e9;
  color:#fff;
  border:none;
  border-radius:12px;
  padding:8px 16px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}

.login-btn:hover{
  background:#0284c7;
}

.login-btn:active{
  transform:scale(.96);
}

  
  
/* CATEGORIES */
#categories{
  display:none;position:absolute;top:230px;left:50%;
  transform:translateX(-50%);
  background:white;width:300px;border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:10;color:#0f172a;
}
  
/* Items del menú de categorías */
#categories div{
  display:flex;
  flex-direction:row;   /* ⬅️ CLAVE */
  align-items:center;
  gap:12px;

  padding:14px 16px;
  font-size:18px;
  font-weight:600;
}


.brand-logo{
  width:36px;
  height:36px;
  min-width:36px;
  min-height:36px;
  object-fit:contain;
  display:block;
}

.product-name-wrap{
  display:flex;
  align-items:center;
  gap:6px;
}


#categories div:hover{background:#e2e8f0}

/* MAIN */
main{padding:24px}
.section{margin-bottom:40px}
.section-title{
  display:flex;
  align-items:center;
  gap:12px;

  font-size:26px;          /* ⬅️ MÁS GRANDE */
  font-weight:700;

  margin-bottom:18px;
  padding-left:10px;
  border-left:6px solid #0ea5e9;
}

.section-brand-logo{
  width:42px;
  height:42px;
  min-width:42px;
  min-height:42px;
  object-fit:contain;
}



/* SLIDER */
.slider{position:relative}
.track{display:flex;gap:16px;overflow:hidden;scroll-behavior:smooth}
.arrow {
  position: absolute;
  top: 45%;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: #1e293b;
  color: white;
  font-size: 20px;
  cursor: pointer;
  z-index: 5;
  display: none; /* Se controla por JS */
}


.arrow.left{left:-18px}
.arrow.right{right:-18px}

/* CARD */
.card{
  background:#ffffff;
  width:220px;
  min-width:220px;
  border-radius:18px;
  padding:14px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:relative;

  /* visual */
  box-shadow:0 10px 28px rgba(0,0,0,.10);
  
  /* animación entrada */
  opacity:0;
  transform:translateY(20px);
  transition:opacity .5s ease, transform .5s ease, box-shadow .3s ease;
}

.card.show{opacity:1;transform:none}
.card:hover{transform:translateY(-6px); box-shadow:0 18px 40px rgba(0,0,0,.14);}
.card.disabled{opacity:.45;pointer-events:none}
.card img{width:100%;height:140px;object-fit:contain;cursor:pointer}
.card h3{font-size:14px;margin:8px 0;min-height:36px;cursor:pointer}
.price{font-weight:700;color:#16a34a}
.old-price{text-decoration:line-through;color:#64748b;margin-right:6px}

/* BADGES */
.discount-badge{position:absolute;top:10px;left:10px;background:#dc2626;color:white;font-size:12px;padding:4px 8px;border-radius:10px}
.last-unit{position:absolute;top:10px;right:10px;background:#f59e0b;color:white;font-size:12px;padding:4px 8px;border-radius:10px}
.out-stock{position:absolute;top:10px;right:10px;background:#6b7280;color:white;font-size:12px;padding:4px 8px;border-radius:10px}
.in-stock{
  position:absolute;
  top:10px;
  right:10px;
  background:#16a34a;
  color:white;
  font-size:12px;
  padding:4px 8px;
  border-radius:10px;
}

.pre-order{
  position:absolute;
  top:10px;
  right:10px;
  background:#6366f1;
  color:white;
  font-size:12px;
  padding:4px 8px;
  border-radius:10px;
}

.estimated-delivery{
  margin-top:6px;
  font-size:12px;
  font-weight:600;
  color:#4f46e5;       /* violeta elegante */
  background:#eef2ff;
  padding:4px 8px;
  border-radius:8px;
  text-align:center;
}

.estimated-delivery div:first-child{
  font-size:11px;
  opacity:.85;
}

.estimated-delivery div:last-child{
  font-size:12px;
  font-weight:700;
}


/* PRE ORDER BADGE */
.preorder-badge{
  position:absolute;
  top:10px;
  left:10px;
  background:#7c3aed; /* violeta */
  color:white;
  font-size:12px;
  font-weight:700;
  padding:4px 10px;
  border-radius:10px;
  cursor:help;
}

/* TOOLTIP */
.tooltip{
  position:relative;
  display:inline-block;
}

.tooltip .tooltip-text{
  visibility:hidden;
  width:220px;
  background:#111827;
  color:#fff;
  text-align:left;
  padding:8px 10px;
  border-radius:8px;
  font-size:12px;
  line-height:1.4;
  position:absolute;
  z-index:99;
  bottom:125%;
  left:50%;
  transform:translateX(-50%);
  opacity:0;
  transition:.2s;
}

.tooltip:hover .tooltip-text{
  visibility:visible;
  opacity:1;
}

/* Mobile: mostrar tooltip al tap */
@media (max-width: 768px){
  .tooltip:hover .tooltip-text{
    visibility:hidden;
    opacity:0;
  }
}



/* QTY */
.qty{display:flex;justify-content:center;gap:8px;margin:6px 0}
.qty button{width:28px;height:28px;border:none;border-radius:6px;background:#334155;color:white;cursor:pointer;transition:.2s}
.qty button:active{transform:scale(.92)}

/* BUTTONS */
.add-btn,.buy-btn{
  height:38px;border-radius:12px;
  border:none;cursor:pointer;
  transition:.2s;width:100%;margin-top:6px
}
.add-btn{background:#0ea5e9;color:white}
.buy-btn{background:#16a34a;color:white;display:flex;align-items:center;justify-content:center;gap:6px}
.add-btn:hover,.buy-btn:hover{transform:translateY(-2px)}
.add-btn:active,.buy-btn:active{transform:scale(.92)}
.buy-btn img{width:16px}

/* DETAIL */
#detail{display:none}
.back-btn img{width:36px;cursor:pointer;margin-bottom:16px}
.detail-box{
  display:flex;gap:28px;background:white;
  padding:24px;border-radius:22px;
  align-items:center;justify-content:center
}
.detail-box img{width:280px}
.detail-info{max-width:360px}

  /* SLIDER IMÁGENES DETALLE */
.detail-slider{
  width:100%;
  max-width:1000px;   /* 👈 mismo valor */
  margin:0 auto;
  overflow:hidden;
}

.detail-track{
  display:flex;
  transition: transform .45s ease;
}

.detail-img{
  flex: 0 0 100%; /* ⬅️ cada imagen ocupa 100% del ancho del slider */
  width:100%;
  max-width:1000px;
  user-select:none;
  pointer-events:auto;
  transform-origin: 50% 50%;
  cursor: zoom-in;
  transition: transform .3s ease;
}

.detail-img.zoomed{
  transform: scale(3);
  cursor: zoom-out;
}

@media(max-width:768px){
  .detail-img{
    max-width:100%;
  }

  .detail-img.zoomed{
    transform: scale(2);
  }
}

.detail-slider img{
  width:100%;
  border-radius:14px;
}

.slider-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,.5);
  color:white;
  border:none;
  width:32px;
  height:32px;
  border-radius:50%;
  cursor:pointer;
}

.slider-btn.prev{left:6px}
.slider-btn.next{right:6px}

.detail-dots{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-top:8px;
  padding-bottom:6px; /* 👈 AQUÍ */
}

.detail-dots span{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#cbd5e1;
  cursor:pointer;
}

.detail-dots span.active{
  background:#0ea5e9;
}

/* CART */
#cart-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5)}
#cart-overlay.active{display:block}
#cart{
  position:fixed;right:-420px;top:0;width:420px;height:100%;
  background:white;padding:20px;transition:.3s;z-index:50
}
#cart.active{right:0}

/* CATEGORIES OVERLAY */
#categories-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:transparent;
  z-index:9;
}
#categories-overlay.active{
  display:block;
}

.cart-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px}
.cart-item small{color:#dc2626}
.cart-item button{border:none;background:none;cursor:pointer}

/* MOBILE */
@media(max-width:768px){
  .detail-box{flex-direction:column}
  .detail-box img{width:100%}
}

@media (max-width: 768px){

  /* HEADER */
  .header-top{
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo{
    height: 110px;
    margin: 0 auto;
  }

  .search-area{
    width: 100%;
  }

  .icons{
    width: 100%;
    justify-content: center;
  }

  /* SLIDER */
  .track{
    overflow-x: auto;
    padding-bottom: 10px;
  }

  .arrow{
    display: none !important; /* flechas fuera en móvil */
  }

  /* CARDS */
  .card{
    width: 160px;
    min-width: 160px;
  }

  .card img{
    height: 110px;
  }

  .card h3{
    font-size: 13px;
  }

  /* DETAIL */
  .detail-box{
    padding: 16px;
    gap: 16px;
  }

  .detail-info{
    text-align: center;
  }

  /* CART */
  #cart{
    width: 100%;
  }

    /* GRID CATEGORÍAS: 2 columnas en móvil */
  .grid-products {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  
}


/* ===============================
   GRID + PAGINACIÓN POR CATEGORÍA
================================ */
.grid-products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:18px;
}

/* =========================
   Precio detalle más grande
========================= */
.detail-info .price {
  font-size: 32px;    /* grande en desktop */
  font-weight: 700;
  color: #16a34a;
  margin: 10px 0;
}

/* Botón Volver al lado izquierdo del slider solo en detalle */
.detail-box .back-btn {
  position: absolute;       /* lo posicionamos sobre el slider */
  left: 8px;                /* espacio desde la izquierda */
  top: 50%;                 /* centrado verticalmente */
  transform: translateY(-50%); /* centrado exacto */
  z-index: 10;              /* encima de la imagen */
  cursor: pointer;
}

.detail-box .back-btn img {
  width: 32px;              /* tamaño del icono */
  height: 32px;
}


/* ⬅️ SOLO DETALLE DEL PRODUCTO */
.detail-info .qty button {
  width:40px;       /* antes 28px */
  height:40px;      /* antes 28px */
  font-size:18px;   /* tamaño de + y - */
}

.detail-info .qty .q-span {
  font-weight: 700;
  font-size:28px;   /* tamaño del número central */
  min-width:30px;
  text-align:center;
}

/* ⬅️ SOLO DETALLE DEL PRODUCTO */
.detail-info .add-btn,
.detail-info .buy-btn {
  height:50px;      /* antes 38px */
  font-size:16px;   /* texto más grande */
  gap:10px;         /* más espacio entre icono y texto en comprar ahora */
}
  
/* Ajuste para móviles */
@media(max-width:768px){
  .detail-info .price {
    font-size: 24px;   /* más pequeño en móviles */
  }
  .detail-info .qty .q-span {
  font-weight: 700;  /* sigue en negrita */
  font-size: 20px;   /* tamaño adecuado para móvil */
  }
  .detail-box .back-btn {
  left: 4px;
  top: 4px;
  transform: none;
  }
  .detail-box .back-btn img {
  width: 28px;
  height: 28px;
  }
}

  
.pagination{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:24px;
}

.pagination button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:#e5e7eb;
  cursor:pointer;
  font-weight:600;
}

.pagination button.active{
  background:#0ea5e9;
  color:white;
}

.user-menu {
  position: relative;
}

.user-dropdown {
  position: absolute;
  top: 110%;
  right: 0;
  background: #1f2933;
  border-radius: 10px;
  min-width: 160px;
  display: none;
  box-shadow: 0 10px 25px rgba(0,0,0,.25);
  overflow: hidden;
  z-index: 1000;
}

.user-dropdown div {
  padding: 12px 16px;
  cursor: pointer;
  color: #fff;
  font-weight: 500;
}

.user-dropdown div:hover {
  background: #374151;
}


  
</style>
</head>

  <!-- MODAL PERFIL OBLIGATORIO -->

<!-- MODAL CHECKOUT -->
<div id="checkoutModal" style="
  display:none;

  inset:0;
  background:rgba(0,0,0,.6);

  align-items:center;
  justify-content:center;
">
  <div style="
    background:white;

<!-- MODAL MIS PEDIDOS -->
<div id="ordersModal" style="
  display:none;

">
  <div style="

<!-- MODAL LOGIN -->

">
  <div style="background:white;padding:20px;border-radius:14px;width:90%;max-width:360px;text-align:center">

    <button onclick="loginWithGoogle()"

      Continuar con Google
    </button>
  </div>
</div>

let detailIndex = 0;

const BRAND_LOGOS = {
  "minigt": "imagenes/brands/minigt.svg",
  "poprace": "imagenes/brands/poprace.jpg",

function listenProductsRealtime() {
  const ref = collection(db, "products");

  DATA = { stock: {}, preventa: {} };
  onSnapshot(ref, (snapshot) => {
    DATA = {}; // reset limpio

    snapshot.forEach(docu => {
      const data = docu.data();

const p = {
  id: docu.id,
  ...data,
  stock: Number(data.stock) || 0   // 👈 CLAVE
};


      // 🔒 Evitar documentos basura (ej: init)
      if (
  !p.name ||
  !p.category ||
  typeof p.price !== "number"
) return;


      // ❌ NO mostrar productos inactivos
      if (p.active === false) return;

      const type = p.saleType === "preventa" ? "preventa" : "stock";

if (!DATA[type]) DATA[type] = {};
if (!DATA[type][p.category]) DATA[type][p.category] = [];

p._qty = 1;
DATA[type][p.category].push(p);

    });

    buildCategories();
    renderAll();
  });
}

async function reserveStock(productId, qty) {
  const ref = doc(db, "products", productId);

  try {
    await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(ref);
      if (!snap.exists()) throw "Producto no existe";

      const data = snap.data();

      if (data.stock < qty) {
        throw "Stock insuficiente";
      }

      transaction.update(ref, {
        stock: data.stock - qty
      });
    });

    return true;
  } catch (e) {
    console.warn("❌ No se pudo reservar stock:", e);
    return false;
  }
}

    .then(() => {

// Timer carrito
function startCartTimer(){
  setInterval(()=>{
    checkExpiredCart();
    renderCart();
  }, 1000);
}

function checkExpiredCart(){
  const now = Date.now();

  Object.entries(CART).forEach(([id, item])=>{
    if(now - item.time > CART_TIMEOUT){
  // solo liberar si NO se confirmó pedido
  delete CART[id];
  }
});

  saveCart();
}

  
async function processCheckout() {
  if (checkoutInProgress) return;
  checkoutInProgress = true;

  if (!currentUser || currentUser.isAnonymous) {
    alert("Debes iniciar sesión antes de finalizar el pedido.");
    document.getElementById("loginModal").style.display = "flex";
    checkoutInProgress = false;
    return;
  }

  let total = 0;

  Object.values(CART).forEach(item => {
    const price = item.discount ? item.finalPrice : item.price;
    total += price * item.qty;
  });

  await addDoc(collection(db, "orders"), {
    userId: currentUser.uid,
    items: Object.values(CART),
    total,
    status: "confirmado",
    createdAt: serverTimestamp()
  });

  CART = {};
  saveCart();
  renderCart();

  document.getElementById("checkoutModal").style.display = "none";
  checkoutInProgress = false;

  alert("✅ Pedido registrado correctamente");
}

  return Math.max(0, Number(p.stock) || 0);
}

      renderSection(cat, products);
    }

  // 👉 Si una categoría NO existe en stock, mostrarla desde preventa

function startDetailSlider(){
  detailIndex = 0;

  stopDetailSlider();
  detailTimer = setInterval(()=>{
    nextDetailImg(true);
  },3000);
}

function stopDetailSlider(){
  if(detailTimer){
    clearInterval(detailTimer);
    detailTimer = null;
  }
}

function updateDetailImg(){
  const track = document.querySelector(".detail-track");
  if(!track) return;

  track.style.transform = `translateX(-${detailIndex * 100}%)`;

// 🔒 quitar zoom al cambiar de imagen
document.querySelectorAll(".detail-img")
  .forEach(img => {
    img.classList.remove("zoomed");
    img.style.transformOrigin = "50% 50%";
  });



  document.querySelectorAll(".detail-dots span")
    .forEach((d,i)=>d.classList.toggle("active", i === detailIndex));
}


function nextDetailImg(auto=false){
  if(!auto) stopDetailSlider();

  const total = document.querySelectorAll(".detail-img").length;
  if(!total) return;

  detailIndex = (detailIndex + 1) % total;
  updateDetailImg();
}


function prevDetailImg(){
  stopDetailSlider();

  const total = document.querySelectorAll(".detail-img").length;
  if(!total) return;

  detailIndex = (detailIndex - 1 + total) % total;
  updateDetailImg();
}


function goDetailImg(i){
  stopDetailSlider();
  detailIndex = i;
  updateDetailImg();
}

  startDetailSlider();
}
updateDetailImg();

// 🛑 Pausar slider al pasar el mouse (desktop)
const slider = document.querySelector(".detail-slider");
if (slider) {
  slider.addEventListener("mouseenter", stopDetailSlider);
  slider.addEventListener("mouseleave", () => {
    if (imgs.length > 1) startDetailSlider();
  });

  // 📱 Swipe móvil
  let startX = 0;
  let endX = 0;

  slider.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    moved = false;
  }, { passive: true });

  slider.addEventListener("touchmove", e => {
  endX = e.touches[0].clientX;
  if (Math.abs(startX - endX) > 10) {
    moved = true;
  }
}, { passive: true });


  slider.addEventListener("touchend", () => {
    const diff = startX - endX;
    if (Math.abs(diff) > 50) {
      stopDetailSlider();
      diff > 0 ? nextDetailImg() : prevDetailImg();
    }
  });
}

  document.querySelectorAll(".detail-img").forEach(img => {
  const newImg = img.cloneNode(true);
  img.replaceWith(newImg);
});

  // 🔍 Zoom imagen
  document.querySelectorAll(".detail-img").forEach(img => {
  let lastTap = 0;

  // 🖱️ Click desktop
  img.addEventListener("click", () => {
    if (moved) {
      moved = false;
      return;
    }
    img.classList.toggle("zoomed");
    img.style.transformOrigin = "50% 50%";
  });

  // 🔍 Lupa que sigue el mouse (desktop)
  img.addEventListener("mousemove", e => {
    if (!img.classList.contains("zoomed")) return;

    const rect = img.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;

    img.style.transformOrigin = `${x}% ${y}%`;
  });

  img.addEventListener("mouseleave", () => {
    img.style.transformOrigin = "50% 50%";
  });

  // 📱 Doble tap mobile
  img.addEventListener("touchend", () => {
    const now = Date.now();
    if (now - lastTap < 300) {
      img.classList.toggle("zoomed");
    }
    lastTap = now;
  });
});
}

// Cambiar cantidad
function changeQty(name,d){
  const p=Object.values(DATA)
  .flatMap(type => Object.values(type || {}).flat())
.find(x=>x.name===name);
  if (p.saleType === "preventa") {
  p._qty = Math.max(1, p._qty + d);
} else {
  p._qty = Math.max(1, Math.min(available(p), p._qty + d));
}

  document.querySelectorAll(".q-span").forEach(e => {
  const cardName =
    e.closest(".card")?.querySelector("h3")?.innerText;

  const detailName =
    e.closest(".detail-info")?.querySelector("h2")?.innerText;

  if (cardName === name || detailName === name) {
    e.innerText = p._qty;
  }
});

}

// Guardar carrito en localStorage
function saveCart() {
  localStorage.setItem("cart", JSON.stringify(CART));
}

// Render del carrito
function renderCart() {
  const now = Date.now();

  // Limpiar items expirados
  Object.entries(CART).forEach(([id, item]) => {
    if (!checkoutConfirmed && now - item.time > CART_TIMEOUT) {
      delete CART[id];
    }
  });

  saveCart();

  cartItems.innerHTML = "";
  let total = 0;

  Object.values(CART).forEach(item => {
    const price = item.discount ? item.finalPrice : item.price;
    const linePrice = price * item.qty;
    total += linePrice;

    const div = document.createElement("div");
    div.className = "cart-item";
    div.innerHTML = `
      <span>${item.name} x ${item.qty}</span>
      <small>S/ ${linePrice.toFixed(2)}</small>
      <button onclick="removeFromCart('${item.id}')">✕</button>
    `;
    cartItems.appendChild(div);
  });

  cartTotal.innerText = total.toFixed(2);
  cartCount.innerText = Object.keys(CART).length;

  // Timer reserva
  if (Object.keys(CART).length) {
    const earliest = Math.min(...Object.values(CART).map(i => i.time));
    const remaining = Math.max(0, CART_TIMEOUT - (now - earliest));
    const minutes = Math.floor(remaining / 60000);
    const seconds = Math.floor((remaining % 60000) / 1000);
    cartTimer.innerText = ` (reserva: ${minutes}m ${seconds}s)`;
  } else {
    cartTimer.innerText = "";
  }
}

// Añadir producto al carrito
async function addToCart(name) {
  if (reserving) return;
  reserving = true;

  const p = Object.values(DATA).flatMap(type => Object.values(type || {}).flat())
    .find(x => x.name === name);
  if (!p) { reserving = false; return; }

  // Inicializar item
  if (!CART[p.id]) {
    CART[p.id] = {
      id: p.id,
      name: p.name,
      price: p.price,
      finalPrice: p.finalPrice ?? p.price,
      discount: p.discount ?? 0,
      qty: 0,
      time: Date.now()
    };
  }

  // Actualizar cantidad
  CART[p.id].qty += p._qty;
  CART[p.id].time = Date.now();

  saveCart();
  renderCart();

  reserving = false;
}

// Quitar producto del carrito
function removeFromCart(id) {
  delete CART[id];
  saveCart();
  renderCart();
}

// Timer para limpiar items expirados cada segundo
setInterval(() => {
  renderCart();
}, 1000);

// Abrir/ cerrar carrito
function toggleCart(show) {
  const overlay = document.getElementById("cart-overlay");
  const cart = document.getElementById("cart");

  if (show) {
    overlay.classList.add("active");
    cart.classList.add("active");
  } else {
    overlay.classList.remove("active");
    cart.classList.remove("active");
  }

  renderCart(); // 🔹 clave para que siempre se vea actualizado
}


// Categorías
function buildCategories(){
  categories.innerHTML = "";

  const parents = [
    { key: "stock", label: "📦 Stock" },
    { key: "preventa", label: "⏳ Preventa" }
  ];

  parents.forEach(parent => {
    if (!DATA[parent.key] || Object.keys(DATA[parent.key]).length === 0) return;

    const parentDiv = document.createElement("div");
    parentDiv.style.fontWeight = "700";
    parentDiv.style.background = "#f1f5f9";
    parentDiv.style.cursor = "pointer";
    parentDiv.innerHTML = parent.label;

    const childContainer = document.createElement("div");
    childContainer.style.display = "none";
    childContainer.style.paddingLeft = "12px";

    parentDiv.onclick = () => {
  renderByType(parent.key);
  closeCategories();
};


    Object.keys(DATA[parent.key]).forEach(cat => {
      const key = cat.replace(/\s+/g,"").toLowerCase();

      const child = document.createElement("div");
      child.style.display = "flex";
      child.style.alignItems = "center";
      child.style.gap = "10px";
      child.style.padding = "10px";

      const logo = BRAND_LOGOS[key]
        ? `<img src="${BRAND_LOGOS[key]}" class="brand-logo">`
        : "";

      child.innerHTML = `${logo}<span>${cat}</span>`;

      child.onclick = () => {
        search.value = "";
        renderByTypeAndCategory(parent.key, cat);
        closeCategories();
      };

      childContainer.appendChild(child);
    });

    categories.appendChild(parentDiv);
    categories.appendChild(childContainer);
  });
}

function renderByTypeAndCategory(type, category){
  currentPage = 1;
  const products = DATA[type][category] || [];
  renderCategoryGrid(`${category} (${type})`, products);
}

function renderByType(type){
  currentPage = 1;

  if (!DATA[type]) return;

  // unir todas las categorías del tipo
  const products = Object.values(DATA[type]).flat();

  renderCategoryGrid(
    type === "stock" ? "📦 Stock" : "⏳ Preventa",
    products
  );
}

function toggleUserMenu() {
  const dd = document.getElementById("userDropdown");
  dd.style.display = dd.style.display === "block" ? "none" : "block";
}

function logout() {
  isLoggingOut = true;
  signOut(auth);
}

   

function toggleCategories(){
  const open = categories.style.display !== "block";
  categories.style.display = open ? "block" : "none";
  document
    .getElementById("categories-overlay")
    .classList.toggle("active", open);
}

  function closeCategories(){
  categories.style.display = "none";
  document
    .getElementById("categories-overlay")
    .classList.remove("active");
}

document.addEventListener("click", e => {

  // + cantidad
  if (e.target.closest(".btn-plus")) {
    const name = e.target.closest("button").dataset.name;
    changeQty(name, 1);
  }

  // - cantidad
  if (e.target.closest(".btn-minus")) {
    const name = e.target.closest("button").dataset.name;
    changeQty(name, -1);
  }

  // Añadir / Reservar
  if (e.target.closest(".add-btn")) {
    const name = e.target.closest("button").dataset.name;
    addToCart(name);
  }

  // Comprar ahora
  if (e.target.closest(".buy-btn")) {
    const name = e.target.closest("button").dataset.name;
    buyNow(name);
  }

});

function openOrders() {
  const list = document.getElementById("ordersList");
  list.innerHTML = "";

  if (ordersUnsub) ordersUnsub(); // cerrar listener previo

  ordersUnsub = onSnapshot(collection(db, "orders"), snapshot => {
    list.innerHTML = "";

    snapshot.forEach(docu => {
      const o = docu.data();
      if (o.userId !== currentUser.uid) return;

      const div = document.createElement("div");
      div.style.borderBottom = "1px solid #e5e7eb";
      div.style.padding = "10px 0";

      div.innerHTML = `
        <strong>Total: S/ ${o.total.toFixed(2)}</strong><br>
        <small>${o.status}</small>
      `;
      list.appendChild(div);
    });
  });

  document.getElementById("ordersModal").style.display = "flex";
}



function closeOrders() {
  document.getElementById("ordersModal").style.display = "none";
  if (ordersUnsub) {
  ordersUnsub();
  ordersUnsub = null;
}

}

document.addEventListener("click", e => {
  const menu = document.getElementById("userMenu");
  const dropdown = document.getElementById("userDropdown");

  if (!menu || !dropdown) return;

  if (!menu.contains(e.target)) {
    dropdown.style.display = "none";
  }
});
